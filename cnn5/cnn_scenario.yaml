management:                 # Management application properties
  - task: mapper_task       # Required: the first management task should be mapper_task
    static_mapping: [0,0]   # Shares with p5_3
apps:                       # Application properties
  - name: cnn5
    static_mapping:         # Static mapping minimizing XY-routing hops (total = 97, max edge = 4)
                            # Constraint: layer gap ≥ 4 for all PE-sharing task pairs
                            # Constraint: tasks_per_PE ≤ 2
                            # Constraint: no p1 task on [0,0]
      # ── Conv1 workers ──────────────────────────────────────────────────────
      p1_0: [0,3]   # shares with p5_0 (layer gap = 4); dist p2 = 1
      p1_1: [1,0]   # shares with p5_1 (layer gap = 4); dist p2 = 2
      p1_2: [1,1]   # shares with p6   (layer gap = 5); dist p2 = 1
      # ── Conv1 accumulator ──────────────────────────────────────────────────
      # Central to p1 workers; shares with p10 (layer gap = 8)
      p2:   [1,2]
      # ── Conv2 workers ──────────────────────────────────────────────────────
      # All 8 workers receive from p2[1,2] and send to p4[2,2].
      p3_0: [0,1]   # shares with p7_0 (layer gap = 4)
      p3_1: [2,0]   # shares with p7_1 (layer gap = 4)
      p3_2: [3,3]   # shares with p7_2 (layer gap = 4)
      p3_3: [2,1]   # shares with p7_3 (layer gap = 4)
      p3_4: [3,1]   # shares with p7_4 (layer gap = 4)
      p3_5: [2,3]   # shares with p7_5 (layer gap = 4)
      p3_6: [3,2]   # shares with p9_0 (layer gap = 6)
      p3_7: [1,3]   # shares with p9_1 (layer gap = 6)
      # ── Conv2 accumulator ──────────────────────────────────────────────────
      # Central to p3 workers; shares with p8 (layer gap = 4)
      p4:   [2,2]
      # ── Conv3 workers ──────────────────────────────────────────────────────
      p5_0: [0,3]   # shares with p1_0 (layer gap = 4); dist p4 = 3, dist p6 = 2
      p5_1: [1,0]   # shares with p1_1 (layer gap = 4); dist p4 = 3, dist p6 = 1
      p5_2: [0,2]   # shares with p9_2 (layer gap = 4); dist p4 = 2, dist p6 = 2
      p5_3: [0,0]   # shares PE with mapper_task;       dist p4 = 4, dist p6 = 2
      # ── Conv3 accumulator ──────────────────────────────────────────────────
      # Shares with p1_2 (layer gap = 5)
      p6:   [1,1]
      # ── Conv4 workers ──────────────────────────────────────────────────────
      p7_0: [0,1]   # shares with p3_0 (layer gap = 4); dist p6 = 1, dist p8 = 3
      p7_1: [2,0]   # shares with p3_1 (layer gap = 4); dist p6 = 2, dist p8 = 2
      p7_2: [3,3]   # shares with p3_2 (layer gap = 4); dist p6 = 4, dist p8 = 2
      p7_3: [2,1]   # shares with p3_3 (layer gap = 4); dist p6 = 1, dist p8 = 1
      p7_4: [3,1]   # shares with p3_4 (layer gap = 4); dist p6 = 2, dist p8 = 2
      p7_5: [2,3]   # shares with p3_5 (layer gap = 4); dist p6 = 3, dist p8 = 1
      # ── Conv4 accumulator ──────────────────────────────────────────────────
      # Shares with p4 (layer gap = 4)
      p8:   [2,2]
      # ── Conv5 workers ──────────────────────────────────────────────────────
      p9_0: [3,2]   # shares with p3_6 (layer gap = 6); dist p8 = 1, dist p10 = 2
      p9_1: [1,3]   # shares with p3_7 (layer gap = 6); dist p8 = 2, dist p10 = 1
      p9_2: [0,2]   # shares with p5_2 (layer gap = 4); dist p8 = 2, dist p10 = 1
      p9_3: [3,0]   # alone;                            dist p8 = 3, dist p10 = 4
      # ── Conv5 accumulator ──────────────────────────────────────────────────
      # Shares with p2 (layer gap = 8)
      p10:  [1,2]