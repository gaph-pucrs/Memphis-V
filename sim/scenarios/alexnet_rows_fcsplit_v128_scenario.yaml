management:                 # Management application properties
  - task: mapper_task       # Required: the first management task should be mapper_task
    static_mapping: [0,0]   # Required: map mapper_task to 0x0
apps:                       # Application properties
  - name: alexnet-rows-fcsplit
    instance: v128
    static_mapping:         # conv and join pairs as in alexnet_rows_*: every conv layer runs at once, so
                            # each PE's two tasks share its core all along. Pairs balance the compute load
                            # (alexnet-overlap v128, M cycles): the 4 c3s and c5_0 (131-144) each with a
                            # join (2-8), c4/c5 (125) with a c1 (80) or c2 (92).
                            # The fc tasks run only after j5, when the conv tasks are done: one per PE,
                            # the f6s (pool5 whole from j5 each) 1-2 hops from j5 on 1x0
      f6_0: [0,0]           # with mapper_task
      f6_1: [2,0]
      f6_2: [1,1]
      f6_3: [0,1]
      f6_4: [3,0]
      f6_5: [2,1]
      f6_6: [1,2]
      f6_7: [3,1]
      f7_0: [1,0]
      f7_1: [0,2]
      f7_2: [2,2]
      f7_3: [3,2]
      f8_0: [1,3]           # gathers fc8 and ends the app
      f8_1: [0,3]
      f8_2: [2,3]
      f8_3: [3,3]
      c5_0: [1,0]
      j5:   [1,0]           # conv5 partials from 1x0, 2x0, 0x1, 1x1
      c5_1: [2,0]
      c2_3: [2,0]
      c5_2: [0,1]
      c2_4: [0,1]
      c5_3: [1,1]
      c2_5: [1,1]
      c4_5: [3,0]
      c2_2: [3,0]
      c3_3: [2,1]
      j4:   [2,1]           # sends conv4 rows to the conv5 PEs, 1-2 hops
      c4_3: [3,1]
      c2_0: [3,1]
      c4_4: [1,2]
      c2_1: [1,2]
      c3_2: [2,2]
      j3:   [2,2]           # sends conv3 rows to the conv4 PEs
      c4_0: [3,2]
      c1_0: [3,2]
      c4_1: [0,2]
      c1_1: [0,2]
      c4_2: [2,3]
      c1_2: [2,3]
      c3_1: [1,3]
      j2:   [1,3]           # conv2 partials from 8 PEs, spread out
      c3_0: [0,3]
      j1:   [0,3]           # conv1 partials from 3x2, 0x2, 2x3
      c2_6: [3,3]
      c2_7: [3,3]
