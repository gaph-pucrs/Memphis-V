management:                 # Management application properties
  - task: mapper_task       # Required: the first management task should be mapper_task
    static_mapping: [0,0]   # Required: map mapper_task to 0x0
apps:                       # Application properties
  - name: alexnet
    instance: v64
    static_mapping:         # 1 inference: one layer computes at a time, so tasks of different layers can share a PE
      j1:   [1,1]           # conv1 PEs are 1 hop from j1
      c1_0: [1,0]
      c1_1: [0,1]
      c1_2: [2,1]
      j2:   [1,1]           # conv2 partials (560 KB each) are 1-2 hops from j2
      c2_0: [1,0]
      c2_1: [0,1]
      c2_2: [2,1]
      c2_3: [1,2]
      c2_4: [2,0]
      c2_5: [0,2]
      c2_6: [2,2]
      c2_7: [3,1]
      j3:   [2,2]           # conv3 partials (254 KB each) are 1-2 hops from j3
      c3_0: [1,2]
      c3_1: [3,2]
      c3_2: [2,3]
      c3_3: [3,1]
      j4:   [1,3]           # conv4 partials (169 KB each) are 1-5 hops from j4
      c4_0: [0,3]
      c4_1: [2,3]
      c4_2: [0,2]
      c4_3: [3,3]
      c4_4: [3,2]
      c4_5: [3,0]
      j5:   [3,3]           # conv5 partials (169 KB each) are 2-4 hops from j5
      c5_0: [3,0]
      c5_1: [2,0]
      c5_2: [1,3]
      c5_3: [0,3]
      classifier: [0,0]     # the only free slot (shares 0x0 with mapper_task); 6 hops from j5, 36 KB message
