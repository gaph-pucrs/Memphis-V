# OSZ zone closing attack test: tc_osz.yaml plus OSZ_ATTACK (simulation only).
#
# Attackers on unused mesh-edge ports inject packets that ignore the
# single-entrance routing (Phivers/sim/OszAttacker.sv):
#   cycle 1.0M  east edge of 4,0 -> 0,0        hits a blocked E port (below the entrance row)
#                                               or the access point of row 0
#   cycle 1.1M  east edge of 4,1 -> 0,1        wrong source at the access point of row 1
#   cycle 1.15M east edge of 4,1 -> 1,1        service 0x50, not allowed at the access point
#   cycle 1.3M  north edge of 0,4 -> 0,1       hits the zone's blocked N edge
# Every one must be dropped, with one "[OSZ] ... dropped packet" line each,
# and the applications must finish normally.
#
# Run with: mint all tc_osz_attack.yaml apps_osz.yaml sc_osz_entrance.yaml --nogui
#
simulation:
  simulator: verilator
  trace: no
hw:                         # Hardware properties
  page_size_inst_KB: 64     # Size of each memory page (maximum task size)
  page_size_data_KB: 64     # Size of each memory page (maximum task size)
  tasks_per_PE: 2           # Maximum number of tasks in the same PE (will define memory size)
  mpsoc_dimension: [5,5]    # Dimension of the many-core
  osz_window: [2,2]         # Optional: OSZ region size [X,Y] from PE 0,0. X <= mpsoc X - 2
  Peripherals:              # Attached peripherals
    - name: APP_INJ         # Mandatory Application Injector peripheral
      pe: 4,4               # Top-right, with the mapper
      port: E               # Connected at port EAST. Note to use a border port.
    - name: MA_INJ          # Mandatory MA Injector peripheral
      pe: 4,4               # Outside the region
      port: N               # Connected at port NORTH. Note to use a border port.
  parameters:               # Optional: list of parameters to be passed to hardware build
    - TRAFFIC_DEBUG: yes    # Optional: enable NoC traffic debugging (default is on)
    - UART_DEBUG: yes       # Optional: enable application stdout to log files (default is on)
    - SCHED_DEBUG: yes      # Optional: enable scheduler debugging (default is on)
    - PIPE_DEBUG: yes       # Optional: enable messaging protocol debug (default is on)
    - RAM_DEBUG: no         # Optional: enable RAM access debug (default is off)
    - RS5_DEBUG: no         # Optional: enable core register bank debug (default is off)
    - DMNI_DEBUG: no
    - OSZ_ATTACK: yes       # Simulation only: zone closing attack test
